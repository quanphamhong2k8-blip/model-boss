<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Đồng Hồ Cổ - Eye of Time (Three.js)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #080705;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 180, 50, 0.8);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ffcc44;
            text-transform: uppercase;
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #c0b090;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>BOSS: MẮT THỜI GIAN — TEMPUS MORI</h1>
        <p>• Nhấn giữ chuột trái & kéo để xoay xem ngoại hình</p>
        <p>• Cuộn chuột để Phóng to / Thu nhỏ</p>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0806);
        scene.fog = new THREE.FogExp2(0x0a0806, 0.012);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const maxAniso = renderer.capabilities.getMaxAnisotropy();

        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 70;
        controls.minDistance = 10;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x332211, 1.5);
        scene.add(ambientLight);

        const goldSpotLight = new THREE.PointLight(0xffaa22, 3.5, 35);
        goldSpotLight.position.set(10, 15, 12);
        goldSpotLight.castShadow = true;
        scene.add(goldSpotLight);

        const eyeGlow = new THREE.PointLight(0xff1100, 5.5, 18);
        eyeGlow.position.set(0, 0, 3);
        scene.add(eyeGlow);

        const backLight = new THREE.DirectionalLight(0xffdd66, 1.2);
        backLight.position.set(-10, -10, -10);
        scene.add(backLight);

        // --- TEXTURE ĐỒNG HỒ (MẶT TRƯỚC & SAU) ---
        // Vẽ chữ dọc theo cung tròn (chữ khắc viền)
        function arcText(ctx, text, cx, cy, radius, aStart, aEnd, flip = false) {
            const n = text.length;
            for (let i = 0; i < n; i++) {
                const t = n === 1 ? 0 : i / (n - 1);
                const a = aStart + (aEnd - aStart) * t;
                ctx.save();
                ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
                ctx.rotate(flip ? a - Math.PI / 2 : a + Math.PI / 2);
                ctx.fillText(text[i], 0, 0);
                ctx.restore();
            }
        }

        function drawScrew(ctx, x, y, r) {
            const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, r);
            g.addColorStop(0, '#c4a468');
            g.addColorStop(1, '#584020');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#241605'; ctx.lineWidth = 3;
            const a = Math.random() * Math.PI;
            ctx.beginPath();
            ctx.moveTo(x - Math.cos(a) * r * 0.7, y - Math.sin(a) * r * 0.7);
            ctx.lineTo(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7);
            ctx.stroke();
        }

        function drawJewel(ctx, x, y, r) {
            const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, r);
            g.addColorStop(0, '#ff8098');
            g.addColorStop(0.5, '#c01838');
            g.addColorStop(1, '#5a0a18');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke();
        }

        // MẶT TRƯỚC: giấy cổ tối, máu vấy, số La Mã tối, vết nứt + máu
        function makeClockFaceTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 1024;
            const ctx = c.getContext('2d');
            const cx = 512, cy = 512;

            // Nền giấy tối ố vàng-nâu
            const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, 512);
            g.addColorStop(0, '#d4c4a0');
            g.addColorStop(0.55, '#b8a078');
            g.addColorStop(1, '#7a6040');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 1024, 1024);

            // Vết ố thời gian tối
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * 1024, y = Math.random() * 1024, r = 25 + Math.random() * 140;
                const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
                rg.addColorStop(0, 'rgba(80,50,20,' + (0.08 + Math.random() * 0.12) + ')');
                rg.addColorStop(1, 'rgba(80,50,20,0)');
                ctx.fillStyle = rg;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }

            // Vết máu / máu vấy
            for (let i = 0; i < 18; i++) {
                const x = Math.random() * 1024, y = Math.random() * 1024;
                const r = 20 + Math.random() * 90;
                const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
                rg.addColorStop(0, 'rgba(120,8,12,' + (0.25 + Math.random() * 0.35) + ')');
                rg.addColorStop(0.5, 'rgba(90,5,8,' + (0.12 + Math.random() * 0.18) + ')');
                rg.addColorStop(1, 'rgba(60,0,0,0)');
                ctx.fillStyle = rg;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }

            // Vệt máu kéo dài
            for (let i = 0; i < 12; i++) {
                ctx.strokeStyle = 'rgba(100,5,10,' + (0.15 + Math.random() * 0.25) + ')';
                ctx.lineWidth = 2 + Math.random() * 5;
                ctx.lineCap = 'round';
                const x = Math.random() * 1024, y = Math.random() * 1024;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.quadraticCurveTo(
                    x + (Math.random() - 0.5) * 80,
                    y + 40 + Math.random() * 100,
                    x + (Math.random() - 0.5) * 40,
                    y + 80 + Math.random() * 120
                );
                ctx.stroke();
            }

            // Hạt noise giấy + máu
            for (let i = 0; i < 10000; i++) {
                const blood = Math.random() > 0.92;
                ctx.fillStyle = blood
                    ? 'rgba(90,5,8,' + (Math.random() * 0.15) + ')'
                    : 'rgba(40,25,10,' + (Math.random() * 0.06) + ')';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }

            // Vòng tròn trang trí tối
            ctx.strokeStyle = 'rgba(50,25,10,0.7)';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(cx, cy, 468, 0, Math.PI * 2); ctx.stroke();
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(cx, cy, 448, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, 275, 0, Math.PI * 2); ctx.stroke();

            // 60 vạch phút
            for (let i = 0; i < 60; i++) {
                const big = i % 5 === 0;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(i / 60 * Math.PI * 2);
                ctx.strokeStyle = big ? '#2a1008' : 'rgba(50,25,10,0.8)';
                ctx.lineWidth = big ? 9 : 3;
                ctx.beginPath();
                ctx.moveTo(0, -452);
                ctx.lineTo(0, big ? -412 : -430);
                ctx.stroke();
                ctx.restore();
            }

            // Số La Mã tối, hơi đỏ máu
            const numerals = ["XII", "I", "II", "III", "IIII", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
            ctx.fillStyle = '#1a0805';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'Bold 72px "Times New Roman", serif';
            for (let i = 0; i < 12; i++) {
                const a = i / 12 * Math.PI * 2;
                const x = cx + Math.sin(a) * 355;
                const y = cy - Math.cos(a) * 355;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(a);
                ctx.fillText(numerals[i], 0, 0);
                ctx.restore();
            }

            // Chữ hãng kinh dị
            ctx.fillStyle = '#3a1008';
            ctx.font = 'Bold 28px "Times New Roman", serif';
            ctx.fillText('CHRONO GUARDIAN', cx, cy + 150);
            ctx.font = 'Italic 22px "Times New Roman", serif';
            ctx.fillStyle = '#5a1810';
            ctx.fillText('· Tempus Mori ·', cx, cy + 188);

            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = maxAniso;
            return tex;
        }

        // MẶT SAU: đồng thau guilloché + tia xước kim loại + vít + đá ruby + chữ khắc
        function makeBackPlateTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 1024;
            const ctx = c.getContext('2d');
            const cx = 512, cy = 512;

            // Nền đồng thau tối
            const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, 512);
            g.addColorStop(0, '#8f6d3c');
            g.addColorStop(0.7, '#6b4f28');
            g.addColorStop(1, '#453014');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 1024, 1024);

            // Vân tia (circular brushing)
            for (let i = 0; i < 240; i++) {
                const a = i / 240 * Math.PI * 2;
                ctx.strokeStyle = 'rgba(255,228,175,' + (0.03 + Math.random() * 0.05) + ')';
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(a) * 70, cy + Math.sin(a) * 70);
                ctx.lineTo(cx + Math.cos(a) * 505, cy + Math.sin(a) * 505);
                ctx.stroke();
            }

            // Hoạ tiết guilloché: vòng tròn đồng tâm
            ctx.strokeStyle = 'rgba(28,16,5,0.3)';
            for (let r = 90; r < 420; r += 13) {
                ctx.lineWidth = r % 39 < 13 ? 3 : 1;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
            }

            // Vòng khắc viền
            ctx.strokeStyle = 'rgba(25,15,5,0.55)';
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.arc(cx, cy, 470, 0, Math.PI * 2); ctx.stroke();
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, cy, 420, 0, Math.PI * 2); ctx.stroke();

            // Chữ khắc vòng quanh viền
            ctx.fillStyle = '#2a1a06';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'Bold 40px "Times New Roman", serif';
            arcText(ctx, '★ CHRONO GUARDIAN ★', cx, cy, 444, -Math.PI / 2 - 0.85, -Math.PI / 2 + 0.85);
            arcText(ctx, 'TEMPUS FUGIT', cx, cy, 444, Math.PI - 0.55, 0.55, true);

            // Đá ruby & vít
            drawJewel(ctx, 738, 512, 17);
            drawJewel(ctx, 256, 571, 15);
            drawJewel(ctx, 512, 512, 20);
            drawScrew(ctx, 281, 281, 15);
            drawScrew(ctx, 743, 281, 15);
            drawScrew(ctx, 281, 743, 15);
            drawScrew(ctx, 743, 743, 15);

            // Vết trầy cũ
            for (let i = 0; i < 22; i++) {
                ctx.strokeStyle = 'rgba(30,18,6,' + (0.08 + Math.random() * 0.12) + ')';
                ctx.lineWidth = 1;
                const x = Math.random() * 1024, y = Math.random() * 1024;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random() - 0.5) * 160, y + (Math.random() - 0.5) * 60);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = maxAniso;
            return tex;
        }

        // --- MATERIALS ---
        const matAntiqueGold = new THREE.MeshStandardMaterial({
            color: 0xc8963e,
            roughness: 0.35,
            metalness: 0.85
        });

        // Vàng bóng riêng cho 3 vòng quỹ đạo (giống hệt nhau)
        const matOrbitGold = new THREE.MeshStandardMaterial({
            color: 0xd9a94e,
            roughness: 0.28,
            metalness: 0.9
        });

        const matDarkBronze = new THREE.MeshStandardMaterial({
            color: 0x3d2b1f,
            roughness: 0.5,
            metalness: 0.7
        });

        const matClockFace = new THREE.MeshStandardMaterial({
            map: makeClockFaceTexture(),
            roughness: 0.65,
            metalness: 0.08
        });

        const matBackPlate = new THREE.MeshStandardMaterial({
            map: makeBackPlateTexture(),
            roughness: 0.45,
            metalness: 0.75
        });

        const matRuby = new THREE.MeshStandardMaterial({
            color: 0xd0103a,
            emissive: 0x550010,
            emissiveIntensity: 0.6,
            roughness: 0.15,
            metalness: 0.3
        });

        // Mắt máu me: củng mạc vàng ố + đỏ máu, mống mắt đỏ rực phát sáng
        const matEyeSclera = new THREE.MeshStandardMaterial({
            color: 0xc8a070,
            roughness: 0.35,
            metalness: 0.05
        });

        const matIris = new THREE.MeshStandardMaterial({
            color: 0xcc0000,
            emissive: 0xff1100,
            emissiveIntensity: 1.4,
            roughness: 0.08,
            metalness: 0.2
        });

        const matPupil = new THREE.MeshBasicMaterial({ color: 0x020000 });

        // Máu đặc / gân máu
        const matBlood = new THREE.MeshStandardMaterial({
            color: 0x8b0000,
            emissive: 0x4a0000,
            emissiveIntensity: 0.5,
            roughness: 0.55,
            metalness: 0.1
        });

        const matVein = new THREE.MeshStandardMaterial({
            color: 0x6b1018,
            emissive: 0x3a0508,
            emissiveIntensity: 0.3,
            roughness: 0.6
        });

        // Mi mắt rách / gỉ sét đẫm máu
        const matEyelidGore = new THREE.MeshStandardMaterial({
            color: 0x5a2010,
            roughness: 0.55,
            metalness: 0.4,
            emissive: 0x2a0800,
            emissiveIntensity: 0.15
        });

        // --- BOSS CREATION ---
        const bossGroup = new THREE.Group();
        scene.add(bossGroup);

        // 1. KHUNG ĐỒNG HỒ CỔ (OUTER FRAME)
        const outerRingGeo = new THREE.TorusGeometry(6.5, 0.6, 16, 64);
        const outerRing = new THREE.Mesh(outerRingGeo, matAntiqueGold);
        outerRing.castShadow = true;
        bossGroup.add(outerRing);

        const innerRingGeo = new THREE.TorusGeometry(5.2, 0.3, 16, 64);
        const innerRing = new THREE.Mesh(innerRingGeo, matDarkBronze);
        bossGroup.add(innerRing);

        // ===== MẶT TRƯỚC NÂNG CẤP: CircleGeometry + texture khắc =====
        const clockFace = new THREE.Mesh(new THREE.CircleGeometry(5.2, 64), matClockFace);
        clockFace.position.z = 0.11;
        clockFace.receiveShadow = true;
        bossGroup.add(clockFace);

        // Vành mép mảnh ngăn vùng số
        const trimRing = new THREE.Mesh(new THREE.TorusGeometry(5.0, 0.06, 10, 64), matAntiqueGold);
        trimRing.position.z = 0.14;
        bossGroup.add(trimRing);

        // 12 đinh tán trên khung
        const rivetGeo = new THREE.SphereGeometry(0.2, 12, 12);
        for (let i = 0; i < 12; i++) {
            const a = i / 12 * Math.PI * 2;
            const rivet = new THREE.Mesh(rivetGeo, matAntiqueGold);
            rivet.position.set(Math.sin(a) * 6.5, Math.cos(a) * 6.5, 0.38);
            bossGroup.add(rivet);
        }

        // 12 vạch giờ nổi 3D đặt trên vạch đậm của texture
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const mark = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.1), matAntiqueGold);
            mark.position.set(Math.sin(angle) * 4.42, Math.cos(angle) * 4.42, 0.16);
            mark.rotation.z = -angle;
            bossGroup.add(mark);
        }

        // Tấm kính mặt đồng hồ
        const glass = new THREE.Mesh(
            new THREE.CircleGeometry(4.95, 64),
            new THREE.MeshPhysicalMaterial({
                color: 0xcfe8ff, transparent: true, opacity: 0.09,
                roughness: 0.03, metalness: 0, side: THREE.DoubleSide, clearcoat: 1
            })
        );
        glass.position.z = 2.55;
        bossGroup.add(glass);

        // ===== MẶT SAU NÂNG CẤP: tấm máy + chữ khắc =====
        const backPlate = new THREE.Mesh(new THREE.CircleGeometry(5.2, 64), matBackPlate);
        backPlate.position.z = -0.35;
        backPlate.rotation.y = Math.PI; // quay để lộ mặt khắc ra phía sau, chữ đọc đúng chiều
        bossGroup.add(backPlate);

        // Vành khắc sau
        const backTrim = new THREE.Mesh(new THREE.TorusGeometry(5.45, 0.12, 12, 64), matAntiqueGold);
        backTrim.position.z = -0.42;
        bossGroup.add(backTrim);

        // Bộ máy lộ (skeleton movement): 3 bánh răng nhỏ quay + đá ruby ở trục
        const mechGears = [];
        const mechDefs = [
            { r: 1.6, teeth: 14, x: -2.3, y: 1.9, speed: 0.9,  mat: matDarkBronze },
            { r: 1.2, teeth: 11, x: 0.6,  y: 2.6, speed: -1.4, mat: matAntiqueGold },
            { r: 1.9, teeth: 16, x: 0.2,  y: -2.0, speed: 0.7, mat: matDarkBronze }
        ];
        for (const def of mechDefs) {
            const coreGeo = new THREE.CylinderGeometry(def.r, def.r, 0.25, 32);
            const gear = new THREE.Group();
            const core = new THREE.Mesh(coreGeo, def.mat);
            core.rotateX(Math.PI / 2);
            gear.add(core);
            // Răng nằm trong mặt XY -> bánh răng song song (0°) với mặt đồng hồ
            const toothGeo = new THREE.BoxGeometry(def.r * 0.2, def.r * 0.3, 0.25);
            for (let i = 0; i < def.teeth; i++) {
                const angle = (i / def.teeth) * Math.PI * 2;
                const tooth = new THREE.Mesh(toothGeo, def.mat);
                tooth.position.set(Math.cos(angle) * (def.r + 0.1), Math.sin(angle) * (def.r + 0.1), 0);
                tooth.rotation.z = angle;
                gear.add(tooth);
            }
            gear.position.set(def.x, def.y, -0.55);
            bossGroup.add(gear);
            mechGears.push({ g: gear, speed: def.speed });

            const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), matRuby);
            jewel.position.set(def.x, def.y, -0.8);
            bossGroup.add(jewel);
        }

        // 2. CON MẮT MÁU ME KINH DỊ Ở TRUNG TÂM
        const eyeGroup = new THREE.Group();
        eyeGroup.position.set(0, 0, 0.3);

        // Củng mạc (lòng trắng) ố vàng
        const eyeballGeo = new THREE.SphereGeometry(2.1, 48, 48);
        const eyeball = new THREE.Mesh(eyeballGeo, matEyeSclera);
        eyeGroup.add(eyeball);

        // Gân máu trên củng mạc (vẽ bằng các ống cong mỏng)
        for (let i = 0; i < 14; i++) {
            const vein = new THREE.Mesh(
                new THREE.TubeGeometry(
                    new THREE.CatmullRomCurve3([
                        new THREE.Vector3(
                            (Math.random() - 0.5) * 1.6,
                            (Math.random() - 0.5) * 1.6,
                            1.6
                        ),
                        new THREE.Vector3(
                            (Math.random() - 0.5) * 2.4,
                            (Math.random() - 0.5) * 2.4,
                            1.85
                        ),
                        new THREE.Vector3(
                            (Math.random() - 0.5) * 3.2,
                            (Math.random() - 0.5) * 3.2,
                            1.55
                        )
                    ]),
                    8, 0.025 + Math.random() * 0.03, 4, false
                ),
                matVein
            );
            eyeGroup.add(vein);
        }

        // Mống mắt đỏ rực
        const irisGeo = new THREE.SphereGeometry(1.25, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2.8);
        const iris = new THREE.Mesh(irisGeo, matIris);
        iris.position.z = 1.12;
        iris.rotation.x = Math.PI / 2;
        eyeGroup.add(iris);

        // Vành iris ngoài tối hơn (viền máu)
        const irisRim = new THREE.Mesh(
            new THREE.TorusGeometry(1.22, 0.08, 8, 32),
            matBlood
        );
        irisRim.position.z = 1.95;
        eyeGroup.add(irisRim);

        // Đồng tử dọc quỷ (slit pupil)
        const pupilGeo = new THREE.BoxGeometry(0.18, 1.55, 0.18);
        const pupil = new THREE.Mesh(pupilGeo, matPupil);
        pupil.position.z = 2.08;
        eyeGroup.add(pupil);

        // Mi mắt rách / đẫm máu (thay vàng sạch)
        const eyelidGeo = new THREE.TorusGeometry(2.18, 0.32, 12, 32, Math.PI);
        const topEyelid = new THREE.Mesh(eyelidGeo, matEyelidGore);
        topEyelid.rotation.z = Math.PI;
        topEyelid.position.z = 0.35;

        const bottomEyelid = new THREE.Mesh(eyelidGeo, matEyelidGore);
        bottomEyelid.position.z = 0.35;
        eyeGroup.add(topEyelid, bottomEyelid);

        // Giọt máu nhỏ quanh mi mắt
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2 + 0.2;
            const drop = new THREE.Mesh(
                new THREE.SphereGeometry(0.08 + Math.random() * 0.06, 8, 8),
                matBlood
            );
            drop.position.set(
                Math.sin(a) * 2.25,
                Math.cos(a) * 2.25 * 0.55,
                0.55 + Math.random() * 0.3
            );
            drop.scale.y = 1.4 + Math.random() * 0.6;
            eyeGroup.add(drop);
        }

        // Ánh sáng đỏ phát từ mắt
        const eyeLight = new THREE.PointLight(0xff1100, 2.5, 12);
        eyeLight.position.set(0, 0, 2.5);
        eyeGroup.add(eyeLight);

        bossGroup.add(eyeGroup);

        // 3. KIM ĐỒNG HỒ NÂNG CẤP (có đuôi đối trọng + nút tâm)
        const handGroup = new THREE.Group();
        handGroup.position.z = 1.2;

        const hourHand = new THREE.Mesh(new THREE.ConeGeometry(0.25, 3.2, 4), matDarkBronze);
        hourHand.position.y = 1.4;
        hourHand.castShadow = true;
        const hourTail = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.0, 4), matDarkBronze);
        hourTail.rotation.z = Math.PI;
        hourTail.position.y = -0.7;
        const hourPivot = new THREE.Group();
        hourPivot.add(hourHand, hourTail);

        const minHand = new THREE.Mesh(new THREE.ConeGeometry(0.18, 4.5, 4), matAntiqueGold);
        minHand.position.y = 2.0;
        minHand.castShadow = true;
        const minTail = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.8, 4), matAntiqueGold);
        minTail.rotation.z = Math.PI;
        minTail.position.y = -0.55;
        const minPivot = new THREE.Group();
        minPivot.add(minHand, minTail);

        handGroup.add(hourPivot, minPivot);
        bossGroup.add(handGroup);

        // Nút tâm vàng che trục kim
        const centerCap = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), matAntiqueGold);
        centerCap.position.z = 1.45;
        bossGroup.add(centerCap);

        // 4. CON LẮC — đã xóa

        // 5. BA VÒNG BÁNH RĂNG QUỸ ĐẠO — CON QUAY HỒI CHUYỂN 3 CHIỀU (GYROSCOPE)
        // Đường kính bánh răng = 2 × đường kính đồng hồ → radius = 13.
        // Tốc độ ×1.5. Mỗi vòng dùng cặp trục khác nhau + offset 60° để không trùng mặt phẳng.
        function createOrbitRing(radius, teethCount, tubeSize, material) {
            const ringGroup = new THREE.Group();

            const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tubeSize, 16, 128), material);
            ringMesh.castShadow = true;
            ringGroup.add(ringMesh);

            const toothLen = radius * 0.055;
            const toothWidth = radius * 0.032;
            const toothGeo = new THREE.BoxGeometry(toothLen, toothWidth, tubeSize * 2.0);
            for (let i = 0; i < teethCount; i++) {
                const angle = (i / teethCount) * Math.PI * 2;
                const tooth = new THREE.Mesh(toothGeo, material);
                const toothDist = radius + tubeSize + toothLen / 2 - 0.05;
                tooth.position.set(Math.cos(angle) * toothDist, Math.sin(angle) * toothDist, 0);
                tooth.rotation.z = angle;
                ringGroup.add(tooth);
            }
            return ringGroup;
        }

        const ORBIT_R = 13.0, ORBIT_TEETH = 68, ORBIT_TUBE = 0.32;
        const orbitRings = [];
        const gyroGimbals = [];

        const gyroGroup = new THREE.Group();
        gyroGroup.position.set(0, 0, 0);
        bossGroup.add(gyroGroup);

        const gyroConfigs = [
            {
                outerAxis: 'y', middleAxis: 'x',
                outerSpeed:  0.825, middleSpeed:  1.35,  spin:  3.9,
                baseAxis: 'z', baseAngle: 0
            },
            {
                outerAxis: 'z', middleAxis: 'y',
                outerSpeed: -1.05,  middleSpeed:  1.725, spin: -3.15,
                baseAxis: 'x', baseAngle: Math.PI / 3
            },
            {
                outerAxis: 'x', middleAxis: 'z',
                outerSpeed:  0.60,  middleSpeed: -1.275, spin:  4.5,
                baseAxis: 'y', baseAngle: Math.PI * 2 / 3
            }
        ];

        for (let i = 0; i < 3; i++) {
            const cfg = gyroConfigs[i];
            const base   = new THREE.Group();
            const outer  = new THREE.Group();
            const middle = new THREE.Group();
            const gear   = createOrbitRing(ORBIT_R, ORBIT_TEETH, ORBIT_TUBE, matOrbitGold);

            base.rotation[cfg.baseAxis] = cfg.baseAngle;
            middle.add(gear);
            outer.add(middle);
            base.add(outer);
            gyroGroup.add(base);

            gyroGimbals.push({ base, outer, middle, gear, cfg });
            orbitRings.push(gear);
        }

        // 6. BỤI VÀNG LẤP LÁNH QUANH BOSS
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(250 * 3);
        for (let i = 0; i < 250; i++) {
            dustPos[i * 3] = (Math.random() - 0.5) * 34;
            dustPos[i * 3 + 1] = (Math.random() - 0.5) * 24;
            dustPos[i * 3 + 2] = (Math.random() - 0.5) * 22 - 2;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
            color: 0xffcc66, size: 0.09, transparent: true, opacity: 0.65
        }));
        scene.add(dust);

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Boss bay bồng bềnh lơ lửng
            bossGroup.position.y = Math.sin(time * 1.8) * 0.5;
            bossGroup.rotation.z = Math.sin(time * 1.0) * 0.03;

            // Con mắt máu me: nhìn quanh + hơi run
            eyeGroup.rotation.y = Math.sin(time * 1.5) * 0.4;
            eyeGroup.rotation.x = Math.cos(time * 2.0) * 0.22;
            eyeGroup.rotation.z = Math.sin(time * 4.5) * 0.04;

            // Kim đồng hồ quay
            minPivot.rotation.z = -time * 3.0;
            hourPivot.rotation.z = -time * 0.4;

            // Hệ con quay hồi chuyển 3 chiều
            gyroGimbals.forEach((g) => {
                const c = g.cfg;
                g.outer.rotation[c.outerAxis]   = time * c.outerSpeed;
                g.middle.rotation[c.middleAxis] = time * c.middleSpeed;
                g.gear.rotation.z               = time * c.spin;
            });
            gyroGroup.rotation.z = time * 0.525;

            // Bánh răng máy lộ mặt sau
            mechGears.forEach(m => { m.g.rotation.z = time * m.speed; });

            // Bụi vàng trôi
            dust.rotation.y = time * 0.03;
            dust.position.y = Math.sin(time * 0.7) * 0.4;

            controls.update();
            renderer.render(scene, camera);
        }

        // --- RESPONSIVE WINDOW ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
